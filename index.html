```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Signals & CMP Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for clean UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }
        .live-dot {
            animation: pulse-dot 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="text-slate-800 antialiased pb-12">

    <!-- Sticky Header & Search Section -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 pt-3 pb-3">
            <!-- Top Row: Title & Controls -->
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold shadow-sm">
                        <i class="fa-solid fa-chart-line text-sm"></i>
                    </div>
                    <div>
                        <h1 class="text-base sm:text-lg font-bold text-slate-900 leading-tight">TradePulse Signals</h1>
                        <p class="text-[11px] text-slate-500 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block live-dot" id="liveIndicatorDot"></span>
                            <span id="marketStatusText">Live CMP Tracking Active</span>
                        </p>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button id="toggleSimBtn" onclick="toggleMarketSimulation()" class="text-xs font-medium px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition flex items-center gap-1.5" title="Pause or Resume live price ticks">
                        <i class="fa-solid fa-pause text-[10px]" id="simBtnIcon"></i>
                        <span id="simBtnText">Live Ticks</span>
                    </button>
                    <button onclick="openAddModal()" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition flex items-center gap-1">
                        <i class="fa-solid fa-plus text-[11px]"></i>
                        <span>Signal</span>
                    </button>
                </div>
            </div>

            <!-- Fixed Search Input Bar (Redundant 7D/30D/All filter tabs removed) -->
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </div>
                <input 
                    type="text" 
                    id="stockSearchInput" 
                    placeholder="Search stock symbol, company or status (e.g. RELIANCE, Target Hit)..." 
                    class="w-full pl-10 pr-10 py-2.5 bg-slate-100/80 border border-slate-200 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl text-sm text-slate-800 placeholder-slate-400 transition outline-none"
                    autocomplete="off"
                >
                <button 
                    id="clearSearchBtn" 
                    onclick="clearSearch()" 
                    class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition"
                    aria-label="Clear search"
                >
                    <i class="fa-solid fa-circle-xmark text-sm"></i>
                </button>
            </div>

            <!-- Live Status Summary Counters -->
            <div class="flex items-center justify-between gap-2 mt-2.5 pt-2 border-t border-slate-100 text-[11px] sm:text-xs overflow-x-auto">
                <div class="flex items-center gap-1.5 shrink-0">
                    <span class="text-slate-500">Total:</span>
                    <span class="font-bold text-slate-800 bg-slate-100 px-2 py-0.5 rounded-md" id="statTotal">0</span>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span class="text-slate-600">Target Hit:</span>
                    <span class="font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200/60" id="statTargetHit">0</span>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                    <span class="w-2 h-2 rounded-full bg-rose-500"></span>
                    <span class="text-slate-600">SL Hit:</span>
                    <span class="font-bold text-rose-700 bg-rose-50 px-2 py-0.5 rounded-md border border-rose-200/60" id="statSlHit">0</span>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    <span class="text-slate-600">Active:</span>
                    <span class="font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md border border-amber-200/60" id="statActive">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Signals Feed -->
    <main class="max-w-3xl mx-auto px-4 pt-4">
        <div id="signalsContainer" class="space-y-3.5">
            <!-- Signal cards rendered dynamically -->
        </div>

        <!-- Empty Search State -->
        <div id="emptyState" class="hidden text-center py-12 px-4 bg-white rounded-2xl border border-slate-200/80 shadow-sm mt-2">
            <div class="w-12 h-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-magnifying-glass text-lg"></i>
            </div>
            <h3 class="text-sm font-semibold text-slate-800">No matching stocks found</h3>
            <p class="text-xs text-slate-500 mt-1 max-w-xs mx-auto">No signals matched your search query. Try another symbol or reset the filter.</p>
            <button onclick="clearSearch()" class="mt-4 px-4 py-2 bg-indigo-600 text-white text-xs font-semibold rounded-xl hover:bg-indigo-700 transition">
                Reset Search
            </button>
        </div>
    </main>

    <!-- Modal for Editing CMP or Adding a Signal -->
    <div id="cmpModal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="font-bold text-slate-900 text-base" id="modalTitle">Update Stock CMP</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500 transition">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            
            <form id="signalForm" onsubmit="handleFormSubmit(event)" class="p-5 space-y-4">
                <input type="hidden" id="editStockId">
                
                <div class="grid grid-cols-2 gap-3" id="symbolFields">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Stock Symbol</label>
                        <input type="text" id="formSymbol" required placeholder="e.g. TCS" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold uppercase focus:bg-white focus:border-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Signal Type</label>
                        <select id="formType" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:bg-white focus:border-indigo-500 outline-none">
                            <option value="BUY">BUY (Long)</option>
                            <option value="SELL">SELL (Short)</option>
                        </select>
                    </div>
                </div>

                <div id="companyField">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Company Name</label>
                    <input type="text" id="formCompany" required placeholder="e.g. Tata Consultancy Services Ltd." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-indigo-500 outline-none">
                </div>

                <div class="grid grid-cols-3 gap-2.5" id="levelsFields">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Entry (₹)</label>
                        <input type="number" step="0.05" id="formEntry" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:border-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-emerald-700 mb-1">Target (₹)</label>
                        <input type="number" step="0.05" id="formTarget" required class="w-full px-3 py-2 bg-emerald-50/50 border border-emerald-200 rounded-xl text-sm font-semibold text-emerald-800 focus:bg-white focus:border-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-rose-700 mb-1">Stop Loss (₹)</label>
                        <input type="number" step="0.05" id="formSl" required class="w-full px-3 py-2 bg-rose-50/50 border border-rose-200 rounded-xl text-sm font-semibold text-rose-800 focus:bg-white focus:border-rose-500 outline-none">
                    </div>
                </div>

                <!-- Current Market Price (CMP) Input -->
                <div class="p-3.5 rounded-xl bg-indigo-50/70 border border-indigo-200">
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-xs font-bold text-indigo-950">Current Market Price (CMP ₹)</label>
                        <span class="text-[11px] font-medium text-indigo-600" id="modalLevelHint">Compare vs Target & SL</span>
                    </div>
                    <input type="number" step="0.05" id="formCmp" required class="w-full px-3.5 py-2.5 bg-white border border-indigo-300 rounded-xl text-base font-bold text-slate-900 focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-600 outline-none">
                    
                    <div id="quickTestPresets" class="hidden flex items-center gap-2 mt-2.5">
                        <span class="text-[11px] text-slate-500 font-medium">Test:</span>
                        <button type="button" onclick="applyPresetCmp('target')" class="text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800 hover:bg-emerald-200 transition">
                            Hit Target
                        </button>
                        <button type="button" onclick="applyPresetCmp('sl')" class="text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-rose-100 text-rose-800 hover:bg-rose-200 transition">
                            Hit Stop Loss
                        </button>
                        <button type="button" onclick="applyPresetCmp('mid')" class="text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-amber-100 text-amber-800 hover:bg-amber-200 transition">
                            Active
                        </button>
                    </div>
                </div>

                <div class="flex items-center gap-2.5 pt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 py-2.5 px-4 rounded-xl border border-slate-200 text-slate-700 text-sm font-semibold hover:bg-slate-50 transition">
                        Cancel
                    </button>
                    <button type="submit" class="flex-1 py-2.5 px-4 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 shadow-sm transition">
                        Save & Compare
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Toast Notification -->
    <div id="toastNotification" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 hidden bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2">
        <i class="fa-solid fa-check-circle text-emerald-400"></i>
        <span id="toastMessage">CMP Updated</span>
    </div>

    <script>
        let stockSignals = [
            {
                id: 'sig-1',
                symbol: 'RELIANCE',
                company: 'Reliance Industries Ltd.',
                type: 'BUY',
                entry: 1285.00,
                target: 1340.00,
                stopLoss: 1255.00,
                cmp: 1344.50,
                timestamp: 'Today, 10:15 AM'
            },
            {
                id: 'sig-2',
                symbol: 'HDFCBANK',
                company: 'HDFC Bank Limited',
                type: 'BUY',
                entry: 1720.00,
                target: 1785.00,
                stopLoss: 1690.00,
                cmp: 1752.40,
                timestamp: 'Today, 09:45 AM'
            },
            {
                id: 'sig-3',
                symbol: 'TATAMOTORS',
                company: 'Tata Motors Limited',
                type: 'BUY',
                entry: 810.00,
                target: 855.00,
                stopLoss: 788.00,
                cmp: 784.20,
                timestamp: 'Yesterday, 02:30 PM'
            },
            {
                id: 'sig-4',
                symbol: 'INFY',
                company: 'Infosys Limited',
                type: 'BUY',
                entry: 1840.00,
                target: 1910.00,
                stopLoss: 1805.00,
                cmp: 1876.80,
                timestamp: 'Yesterday, 11:20 AM'
            },
            {
                id: 'sig-5',
                symbol: 'ZOMATO',
                company: 'Zomato Limited',
                type: 'BUY',
                entry: 262.00,
                target: 285.00,
                stopLoss: 250.00,
                cmp: 287.15,
                timestamp: '18 Nov, 01:10 PM'
            },
            {
                id: 'sig-6',
                symbol: 'BAJFINANCE',
                company: 'Bajaj Finance Limited',
                type: 'SELL',
                entry: 6750.00,
                target: 6520.00,
                stopLoss: 6860.00,
                cmp: 6510.00,
                timestamp: '18 Nov, 10:05 AM'
            }
        ];

        let searchQuery = '';
        let simulationActive = true;
        let simulationInterval = null;

        // Compare CMP with Entry, Target, and Stop Loss levels
        function evaluateSignalStatus(signal) {
            const { type, entry, target, stopLoss, cmp } = signal;
            let status = 'ACTIVE';
            let pnlPercent = 0;
            let progressPercent = 50;

            if (type === 'BUY') {
                pnlPercent = ((cmp - entry) / entry) * 100;
                if (cmp >= target) status = 'TARGET_HIT';
                else if (cmp <= stopLoss) status = 'SL_HIT';

                const totalRange = target - stopLoss;
                progressPercent = totalRange > 0 ? ((cmp - stopLoss) / totalRange) * 100 : 50;
            } else {
                pnlPercent = ((entry - cmp) / entry) * 100;
                if (cmp <= target) status = 'TARGET_HIT';
                else if (cmp >= stopLoss) status = 'SL_HIT';

                const totalRange = stopLoss - target;
                progressPercent = totalRange > 0 ? ((stopLoss - cmp) / totalRange) * 100 : 50;
            }

            progressPercent = Math.max(0, Math.min(100, progressPercent));

            let insightText = '';
            if (status === 'TARGET_HIT') {
                const diff = Math.abs(cmp - target).toFixed(2);
                insightText = `Target achieved! Trading ₹${diff} ${type === 'BUY' ? 'above' : 'below'} target.`;
            } else if (status === 'SL_HIT') {
                const diff = Math.abs(cmp - stopLoss).toFixed(2);
                insightText = `Stop Loss triggered! Breached SL by ₹${diff}.`;
            } else {
                const toTarget = Math.abs(target - cmp);
                const toTargetPct = ((toTarget / cmp) * 100).toFixed(2);
                insightText = `₹${toTarget.toFixed(2)} (${toTargetPct}%) away from Target`;
            }

            return { status, pnlPercent, progressPercent, insightText };
        }

        function formatINR(num) {
            return '₹' + Number(num).toLocaleString('en-IN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function renderSignals() {
            const container = document.getElementById('signalsContainer');
            const emptyState = document.getElementById('emptyState');

            const evaluatedAll = stockSignals.map(sig => ({
                ...sig,
                eval: evaluateSignalStatus(sig)
            }));

            document.getElementById('statTotal').textContent = evaluatedAll.length;
            document.getElementById('statTargetHit').textContent = evaluatedAll.filter(s => s.eval.status === 'TARGET_HIT').length;
            document.getElementById('statSlHit').textContent = evaluatedAll.filter(s => s.eval.status === 'SL_HIT').length;
            document.getElementById('statActive').textContent = evaluatedAll.filter(s => s.eval.status === 'ACTIVE').length;

            const q = searchQuery.trim().toLowerCase();
            const filtered = evaluatedAll.filter(item => {
                if (!q) return true;
                const statusLabel = item.eval.status === 'TARGET_HIT' ? 'target hit' :
                                    item.eval.status === 'SL_HIT' ? 'stop loss hit sl hit' : 'active open';
                return (
                    item.symbol.toLowerCase().includes(q) ||
                    item.company.toLowerCase().includes(q) ||
                    item.type.toLowerCase().includes(q) ||
                    statusLabel.includes(q)
                );
            });

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            container.innerHTML = filtered.map(sig => {
                const { status, pnlPercent, progressPercent, insightText } = sig.eval;

                let cardBorderClass = 'border-slate-200/90';
                let statusBadgeHtml = '';
                let cmpBoxClass = 'bg-slate-50 border-slate-200 text-slate-900';
                let progressBarColor = 'bg-indigo-500';

                if (status === 'TARGET_HIT') {
                    cardBorderClass = 'border-emerald-300 ring-1 ring-emerald-500/10';
                    cmpBoxClass = 'bg-emerald-50/90 border-emerald-200 text-emerald-950';
                    progressBarColor = 'bg-emerald-500';
                    statusBadgeHtml = `
                        <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-200">
                            <i class="fa-solid fa-circle-check text-emerald-600"></i> TARGET HIT
                        </span>
                    `;
                } else if (status === 'SL_HIT') {
                    cardBorderClass = 'border-rose-300 ring-1 ring-rose-500/10';
                    cmpBoxClass = 'bg-rose-50/90 border-rose-200 text-rose-950';
                    progressBarColor = 'bg-rose-500';
                    statusBadgeHtml = `
                        <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-800 border border-rose-200">
                            <i class="fa-solid fa-circle-exclamation text-rose-600"></i> STOP LOSS HIT
                        </span>
                    `;
                } else {
                    statusBadgeHtml = `
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-800 border border-amber-200">
                            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span> ACTIVE
                        </span>
                    `;
                }

                const pnlSign = pnlPercent >= 0 ? '+' : '';
                const pnlColorClass = pnlPercent >= 0 ? 'text-emerald-600' : 'text-rose-600';
                const typeBadgeClass = sig.type === 'BUY'
                    ? 'bg-blue-50 text-blue-700 border-blue-200'
                    : 'bg-purple-50 text-purple-700 border-purple-200';

                return `
                <article class="bg-white rounded-2xl border ${cardBorderClass} p-4 shadow-xs hover:shadow-md transition-all">
                    <div class="flex items-start justify-between gap-2 mb-3">
                        <div>
                            <div class="flex items-center gap-2 flex-wrap">
                                <h2 class="text-base sm:text-lg font-bold text-slate-900 tracking-tight">${sig.symbol}</h2>
                                <span class="text-[11px] font-bold px-2 py-0.5 rounded-md border ${typeBadgeClass}">
                                    ${sig.type}
                                </span>
                            </div>
                            <p class="text-xs text-slate-500 mt-0.5">${sig.company} • <span class="text-slate-400">${sig.timestamp}</span></p>
                        </div>
                        <div class="shrink-0">
                            ${statusBadgeHtml}
                        </div>
                    </div>

                    <!-- CMP Comparison Box -->
                    <div class="rounded-xl border ${cmpBoxClass} p-3 mb-3 flex items-center justify-between gap-3">
                        <div>
                            <span class="text-[11px] font-semibold uppercase tracking-wider opacity-75">Current Market Price (CMP)</span>
                            <div class="flex items-baseline gap-2 mt-0.5">
                                <span class="text-lg sm:text-xl font-extrabold tracking-tight">${formatINR(sig.cmp)}</span>
                                <span class="text-xs font-bold ${pnlColorClass}">
                                    (${pnlSign}${pnlPercent.toFixed(2)}%)
                                </span>
                            </div>
                        </div>

                        <button 
                            onclick="openEditCmpModal('${sig.id}')" 
                            class="px-3 py-1.5 rounded-lg bg-white hover:bg-slate-50 text-slate-700 border border-slate-200/90 shadow-2xs text-xs font-semibold flex items-center gap-1.5 transition shrink-0"
                        >
                            <i class="fa-solid fa-pen-to-square text-indigo-600"></i>
                            <span>Edit CMP</span>
                        </button>
                    </div>

                    <!-- Stop Loss | Entry | Target -->
                    <div class="grid grid-cols-3 gap-2 text-center bg-slate-50/80 rounded-xl p-2.5 border border-slate-100 mb-3">
                        <div class="border-r border-slate-200/70 pr-1">
                            <span class="block text-[10px] font-semibold uppercase text-rose-600/80">Stop Loss</span>
                            <span class="text-xs sm:text-sm font-bold text-rose-700 mt-0.5 block">${formatINR(sig.stopLoss)}</span>
                        </div>
                        <div class="border-r border-slate-200/70 px-1">
                            <span class="block text-[10px] font-semibold uppercase text-slate-500">Entry Price</span>
                            <span class="text-xs sm:text-sm font-bold text-slate-800 mt-0.5 block">${formatINR(sig.entry)}</span>
                        </div>
                        <div class="pl-1">
                            <span class="block text-[10px] font-semibold uppercase text-emerald-600/80">Target Price</span>
                            <span class="text-xs sm:text-sm font-bold text-emerald-700 mt-0.5 block">${formatINR(sig.target)}</span>
                        </div>
                    </div>

                    <!-- SL-to-Target Progress Bar -->
                    <div>
                        <div class="flex items-center justify-between text-[11px] mb-1">
                            <span class="font-medium text-slate-600">${insightText}</span>
                            <span class="font-semibold text-slate-500">${Math.round(progressPercent)}%</span>
                        </div>
                        <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden flex items-center">
                            <div class="h-full ${progressBarColor} rounded-full transition-all duration-500" style="width: ${progressPercent}%"></div>
                        </div>
                    </div>
                </article>
                `;
            }).join('');
        }

        const searchInput = document.getElementById('stockSearchInput');
        const clearBtn = document.getElementById('clearSearchBtn');

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            clearBtn.classList.toggle('hidden', searchQuery.length === 0);
            renderSignals();
        });

        function clearSearch() {
            searchQuery = '';
            searchInput.value = '';
            clearBtn.classList.add('hidden');
            searchInput.focus();
            renderSignals();
        }

        function startMarketSimulation() {
            if (simulationInterval) clearInterval(simulationInterval);
            simulationInterval = setInterval(() => {
                if (!simulationActive) return;

                let updated = false;
                stockSignals = stockSignals.map(sig => {
                    if (evaluateSignalStatus(sig).status === 'ACTIVE') {
                        const pctChange = (Math.random() * 0.0075) - 0.0035;
                        const newCmp = Math.max(1, Number((sig.cmp * (1 + pctChange)).toFixed(2)));
                        updated = true;
                        return { ...sig, cmp: newCmp };
                    }
                    return sig;
                });

                if (updated) renderSignals();
            }, 3000);
        }

        function toggleMarketSimulation() {
            simulationActive = !simulationActive;
            const icon = document.getElementById('simBtnIcon');
            const text = document.getElementById('simBtnText');
            const dot = document.getElementById('liveIndicatorDot');
            const statusText = document.getElementById('marketStatusText');

            if (simulationActive) {
                icon.className = 'fa-solid fa-pause text-[10px]';
                text.textContent = 'Live Ticks';
                dot.classList.remove('bg-slate-400');
                dot.classList.add('bg-emerald-500', 'live-dot');
                statusText.textContent = 'Live CMP Tracking Active';
                showToast('Live CMP price ticks resumed');
            } else {
                icon.className = 'fa-solid fa-play text-[10px]';
                text.textContent = 'Paused';
                dot.classList.remove('bg-emerald-500', 'live-dot');
                dot.classList.add('bg-slate-400');
                statusText.textContent = 'Live CMP Ticks Paused';
                showToast('Live price ticks paused');
            }
        }

        function openEditCmpModal(id) {
            const sig = stockSignals.find(s => s.id === id);
            if (!sig) return;

            document.getElementById('modalTitle').textContent = `Update CMP • ${sig.symbol}`;
            document.getElementById('editStockId').value = sig.id;
            document.getElementById('formSymbol').value = sig.symbol;
            document.getElementById('formCompany').value = sig.company;
            document.getElementById('formType').value = sig.type;
            document.getElementById('formEntry').value = sig.entry;
            document.getElementById('formTarget').value = sig.target;
            document.getElementById('formSl').value = sig.stopLoss;
            document.getElementById('formCmp').value = sig.cmp;

            document.getElementById('modalLevelHint').textContent = `Target: ₹${sig.target} | SL: ₹${sig.stopLoss}`;
            document.getElementById('quickTestPresets').classList.remove('hidden');
            document.getElementById('symbolFields').classList.add('opacity-75', 'pointer-events-none');
            document.getElementById('companyField').classList.add('hidden');

            document.getElementById('cmpModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('formCmp').focus(), 50);
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add New Stock Signal';
            document.getElementById('editStockId').value = '';
            document.getElementById('signalForm').reset();
            document.getElementById('modalLevelHint').textContent = 'Auto-compares on save';
            document.getElementById('quickTestPresets').classList.add('hidden');
            document.getElementById('symbolFields').classList.remove('opacity-75', 'pointer-events-none');
            document.getElementById('companyField').classList.remove('hidden');

            document.getElementById('cmpModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('formSymbol').focus(), 50);
        }

        function closeModal() {
            document.getElementById('cmpModal').classList.add('hidden');
        }

        function applyPresetCmp(mode) {
            const type = document.getElementById('formType').value;
            const target = parseFloat(document.getElementById('formTarget').value);
            const sl = parseFloat(document.getElementById('formSl').value);
            const entry = parseFloat(document.getElementById('formEntry').value);
            const cmpInput = document.getElementById('formCmp');

            if (mode === 'target') {
                cmpInput.value = type === 'BUY' ? (target + 3.50).toFixed(2) : (target - 3.50).toFixed(2);
            } else if (mode === 'sl') {
                cmpInput.value = type === 'BUY' ? (sl - 3.50).toFixed(2) : (sl + 3.50).toFixed(2);
            } else {
                cmpInput.value = ((entry + target) / 2).toFixed(2);
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('editStockId').value;
            const symbol = document.getElementById('formSymbol').value.trim().toUpperCase();
            const company = document.getElementById('formCompany').value.trim();
            const type = document.getElementById('formType').value;
            const entry = parseFloat(document.getElementById('formEntry').value);
            const target = parseFloat(document.getElementById('formTarget').value);
            const stopLoss = parseFloat(document.getElementById('formSl').value);
            const cmp = parseFloat(document.getElementById('formCmp').value);

            if (id) {
                stockSignals = stockSignals.map(s =>
                    s.id === id ? { ...s, entry, target, stopLoss, cmp } : s
                );
                const updatedSig = stockSignals.find(s => s.id === id);
                const res = evaluateSignalStatus(updatedSig);
                const statusMsg = res.status === 'TARGET_HIT' ? 'Target Hit!' :
                                  res.status === 'SL_HIT' ? 'Stop Loss Hit!' : 'Active';
                showToast(`${symbol} CMP updated (${statusMsg})`);
            } else {
                stockSignals.unshift({
                    id: 'sig-' + Date.now(),
                    symbol,
                    company,
                    type,
                    entry,
                    target,
                    stopLoss,
                    cmp,
                    timestamp: 'Just now'
                });
                showToast(`Added ${symbol} signal`);
            }

            closeModal();
            renderSignals();
        }

        function showToast(msg) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastMessage').textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2600);
        }

        document.getElementById('cmpModal').addEventListener('click', (e) => {
            if (e.target.id === 'cmpModal') closeModal();
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderSignals();
            startMarketSimulation();
        });
    </script>
</body>
</html>
