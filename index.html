<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080f1e">
<title>StockPro Positional</title>
<style>
:root{--bg:#080f1e;--panel:#142139;--panel2:#0e192c;--line:#293b56;--text:#edf4ff;--muted:#91a2bb;--green:#35dda2;--red:#ff7186;--amber:#ffd17d;--blue:#6cc4ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 80% -10%,#173b60,transparent 45%),var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding-bottom:30px}
header{padding:22px 17px;background:linear-gradient(135deg,#142b48,#101a2d);border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0}#upd{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}#upd b{color:#d6e4f7}
main{max-width:850px;margin:auto;padding:14px}
input{width:100%;background:var(--panel2);color:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;margin:2px 0 12px;font-size:14px;-webkit-appearance:none;appearance:none}
.card{background:linear-gradient(150deg,#172740,#101a2b);border:1px solid #293d59;border-radius:16px;margin:10px 0;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.lead{display:flex;align-items:center;gap:8px;min-width:0}.name{font-size:17px;font-weight:800;overflow-wrap:anywhere}
.tag{display:inline-block;padding:5px 9px;border-radius:7px;font-size:10px;font-weight:800}.BUY{background:#124c3a;color:#65e8b4}.SELL{background:#542637;color:#ff91a1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid #3a4d68;background:#1a2b44;color:#c3d2e6;border-radius:14px;padding:5px 10px;font-size:11px;font-weight:700}
.st{border-radius:14px;padding:5px 10px;font-size:11px;font-weight:800}
.st-target{background:#10382d;color:#55e6ae}.st-sl{background:#4a2030;color:#ff8da0}.st-active{background:#12304a;color:var(--blue)}.st-waiting{background:#4a3a18;color:var(--amber)}.st-missed,.st-unknown{background:#2a3446;color:#aebbd0}
.meta{font-size:11px;color:var(--muted);margin-top:6px}
.mid{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}.mid b{font-size:19px;color:#fff;margin-right:4px}.g{color:var(--green)!important}.r{color:var(--red)!important}
.bar{position:relative;height:6px;border-radius:3px;background:#2a3445;margin:22px 8px 10px}
.fill{position:absolute;top:0;height:6px;border-radius:3px}
.tick{position:absolute;top:-6px;width:3px;height:18px;border-radius:2px;transform:translateX(-50%)}
.dot{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #0c1729;transform:translateX(-50%);z-index:2}
.labels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}.labels div{font-size:11px;color:var(--muted)}.labels b{display:block;font-size:15px;margin-top:2px;color:#fff}
.labels div:nth-child(2){text-align:center}.labels div:nth-child(3){text-align:right}
.when{font-size:11px;color:var(--muted);margin-top:8px;text-align:right}
.cmp{font-size:12px;color:var(--muted);margin-top:10px}.cmp b{color:#fff;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid #1d6b57;color:var(--green);border-radius:9px;padding:6px 10px;font-size:12px;font-weight:700}
.chip.hit{background:#12624d;color:#d9fff0;border-color:#1fa37f}
.metrics{display:flex;gap:12px;flex-wrap:wrap;margin-top:11px;font-size:11px;color:var(--muted)}.metrics b{color:#fff}
.warn{margin-top:10px;font-size:11px;color:var(--amber)}.note{margin-top:8px;font-size:11px;color:var(--muted)}
a{color:#70d3ff;text-decoration:none;font-size:11px}
.empty{padding:25px;text-align:center;color:var(--muted);background:var(--panel);border-radius:14px}
.btn{border:1px solid #168565;background:#12624d;color:#8af4c9;border-radius:9px;padding:9px 12px;font-size:11px;font-weight:700}
.foot{max-width:850px;margin:auto;padding:12px 14px 0;color:#71839c;font-size:10px;line-height:1.6}
</style>
</head>
<body>
<header>
 <h1>StockPro Positional</h1>
 <div id="upd">Loading...</div>
</header>
<main>
 <input id="q" type="search" placeholder="Search stock..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
 <div id="list"><div class="empty">Loading...</div></div>
 <button class="btn" id="ref" type="button">↻ Refresh</button>
</main>
<div class="foot">Levels are copied from the channel posts. Prices come from Yahoo Finance and may be delayed. Status is worked out from 15-minute price candles after each post. Check the original post and use your own judgement. This is not advice.</div>
<script>
const DATA_URL="https://raw.githubusercontent.com/mvthegreat-appbuild/StockPro-Positional/main/positional_trades.json";
const REFRESH_MS=5*60*1000;
let data=null,query="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=x=>Number(String(x).replace(/,/g,""));
const cash=x=>"₹"+Number(x).toLocaleString("en-IN",{maximumFractionDigits:2});
const sgn=x=>(x>0?"+":x<0?"-":"")+Math.abs(x).toFixed(2)+"%";
const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function fdt(iso){
 if(!iso)return "";const d=new Date(iso);if(isNaN(d))return "";
 return d.toLocaleString("en-IN",{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true,timeZone:"Asia/Kolkata"});
}
function bar(t,e,sl,ts,cmp){
 const buy=t.side!=="SELL",hit=t.targets_hit||0;
 const vals=[e,sl,...ts];if(cmp)vals.push(cmp);
 const lo=Math.min(...vals),hi=Math.max(...vals),span=(hi-lo)||1;
 const p=v=>((v-lo)/span*100).toFixed(2);
 let h='<div class="bar">';
 if(cmp){const a=Math.min(+p(e),+p(cmp)),w=Math.abs(p(cmp)-p(e)),fav=buy?cmp>=e:cmp<=e;
  h+=`<div class="fill" style="left:${a}%;width:${w}%;background:${fav?"#1b8f54":"#b23a50"}"></div>`;}
 h+=`<div class="tick" style="left:${p(sl)}%;background:#ff5d73"></div>`;
 h+=`<div class="tick" style="left:${p(e)}%;background:#9aa7ba"></div>`;
 ts.forEach((x,i)=>{h+=`<div class="tick" style="left:${p(x)}%;background:${i<hit?"#35dda2":"#1f8a67"}"></div>`;});
 if(cmp)h+=`<div class="dot" style="left:${p(cmp)}%"></div>`;
 return h+"</div>";
}
function card(t){
 const e=num(t.entry),sl=num(t.sl),ts=(t.targets||[]).map(num),sell=t.side==="SELL";
 const last=ts[ts.length-1],t1=ts[0],cmp=t.cmp?Number(t.cmp):null,hit=t.targets_hit||0;
 const status=t.status||"unknown",stext=t.status_text||"Price unavailable";
 const risk=Math.abs(e-sl)/e*100,r1=Math.abs(t1-e)/e*100,rl=Math.abs(last-e)/e*100,rr1=Math.abs(t1-e)/Math.abs(e-sl);
 let left="",right="",when="";
 if(status==="target"||status==="sl"){
  const v=t.realised_pct;if(v!=null)left=`<div><b class="${v>=0?"g":"r"}">${sgn(v)}</b>realised</div>`;
  if(status==="target"){const u=hit>=ts.length?0:t.upside_left_pct;if(u!=null)right=`<div><b>${u.toFixed(2)}%</b>${hit>=ts.length?"upside left":"to next target"}</div>`;
   when=`hit ${fdt(t.hit_time)}`;}else when=`stop loss hit ${fdt(t.sl_time)}`;
 }else if(status==="active"){
  if(t.pnl_pct!=null)left=`<div><b class="${t.pnl_pct>=0?"g":"r"}">${sgn(t.pnl_pct)}</b>now</div>`;
  if(t.upside_left_pct!=null)right=`<div><b>${t.upside_left_pct.toFixed(2)}%</b>to next target</div>`;
  when=t.entry_time?`entered ${fdt(t.entry_time)}`:"";
 }else if(status==="waiting"||status==="missed"){
  if(t.to_entry_pct!=null)left=`<div><b>${t.to_entry_pct.toFixed(2)}%</b>to entry</div>`;
 }
 const first=sell?{k:"Target",v:last}:{k:"SL",v:sl},third=sell?{k:"SL",v:sl}:{k:"Target",v:last};
 const per=(t.period||"").replace(/^hold\s+/i,"");
 const d=t.date?new Date(t.date).toLocaleDateString("en-IN",{day:"numeric",month:"short",timeZone:"Asia/Kolkata"}):"";
 return `<article class="card">
 <div class="top"><div class="lead"><span class="tag ${esc(t.side)}">${esc(t.side)}</span><span class="name">${esc(t.name)}</span></div>
 <div class="tags">${per?`<span class="pill">${esc(per)}</span>`:""}<span class="st st-${esc(status)}">${esc(stext)}</span></div></div>
 <div class="meta">${t.symbol?esc(t.symbol)+" · ":""}posted ${esc(d)}</div>
 <div class="mid">${left||"<div></div>"}${right}</div>
 ${bar(t,e,sl,ts,cmp)}
 <div class="labels"><div>${first.k}<b style="color:${first.k==="SL"?"var(--red)":"var(--green)"}">${cash(first.v)}</b></div><div>Entry ${sell?"below":"above"}<b>${cash(e)}</b></div><div>${third.k}<b style="color:${third.k==="SL"?"var(--red)":"var(--green)"}">${cash(third.v)}</b></div></div>
 ${when?`<div class="when">${esc(when)}</div>`:""}
 <div class="cmp">${cmp?`CMP <b>${cash(cmp)}</b>${t.cmp_time?" · "+esc(fdt(t.cmp_time)):""}`:"CMP unavailable"}</div>
 <div class="chips">${ts.map((x,i)=>`<span class="chip ${i<hit?"hit":""}">${i<hit?"✓ ":""}T${i+1} ${cash(x)}</span>`).join("")}</div>
 <div class="metrics"><span>Risk <b class="r">${risk.toFixed(2)}%</b></span><span>To T1 <b class="g">${r1.toFixed(2)}%</b></span><span>To last <b class="g">${rl.toFixed(2)}%</b></span><span>R:R T1 <b>1 : ${rr1.toFixed(2)}</b></span></div>
 ${t.target_note?`<div class="note">Targets were given as points from entry; converted to prices.</div>`:""}
 ${t.check_levels?`<div class="warn">⚠ Levels look unusual (SL or targets on the wrong side of entry). Check the original post.</div>`:""}
 <div style="margin-top:10px"><a href="${esc(t.link)}" target="_blank" rel="noopener">Open original post ↗</a></div></article>`;
}
function render(){
 if(!data)return;
 const q=norm(query);
 const R=(data.trades||[]).filter(t=>!q||norm((t.name||"")+" "+(t.symbol||"")+" "+(t.symbol_yf||"")).includes(q));
 document.getElementById("list").innerHTML=R.length?R.map(card).join(""):'<div class="empty">No positional trades found.</div>';
}
async function load(){
 const u=document.getElementById("upd");let ok=false;
 try{const r=await fetch(DATA_URL+"?t="+Date.now());if(!r.ok)throw Error();data=await r.json();localStorage.setItem("sp_cache",JSON.stringify(data));ok=true;}
 catch(e){try{data=JSON.parse(localStorage.getItem("sp_cache")||"null");}catch(x){data=null;}}
 if(data){render();
  const s=data.updated?new Date(data.updated).toLocaleString("en-IN"):"unknown";
  u.innerHTML=(ok?"Refreshed":"Saved copy (offline)")+" · Data time: <b>"+esc(s)+"</b><br>App checked at: <b>"+esc(new Date().toLocaleTimeString("en-IN"))+"</b>";
 }else{u.textContent="Could not load data. Check internet and tap Refresh.";document.getElementById("list").innerHTML='<div class="empty">Check your internet and tap Refresh.</div>';}
}
const qi=document.getElementById("q");
["input","keyup","change","search"].forEach(ev=>qi.addEventListener(ev,()=>{query=qi.value;render();}));
document.getElementById("ref").addEventListener("click",load);
load();
setInterval(()=>{if(!document.hidden)load();},REFRESH_MS);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load();});
</script>
</body>
</html>
