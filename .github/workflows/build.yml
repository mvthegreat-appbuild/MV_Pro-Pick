name: Build StockPro APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "StockPro Positional" com.mv.stockpropositional --web-dir www
          npx cap add android
          npx cap sync android

          # Replace default Capacitor icons with android-icons/
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*.png
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
          rm -f android/app/src/main/res/drawable*/ic_launcher*.xml
          rm -f android/app/src/main/res/values/ic_launcher_background.xml
          if [ -f android/app/src/main/res/values/colors.xml ]; then
            sed -i '/ic_launcher_background/d' android/app/src/main/res/values/colors.xml
          fi

          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/values

          cp android-icons/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp android-icons/ic_launcher_round.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp android-icons/ic_launcher_background.xml android/app/src/main/res/values/ic_launcher_background.xml
          cp android-icons/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android-icons/ic_launcher_round.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp android-icons/ic_launcher_foreground.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StockPro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
