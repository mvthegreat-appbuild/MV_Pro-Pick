name: Update StockPro Positional Trades

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stockpro
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MCP library
        run: |
          python -m pip install --upgrade pip
          pip install mcp
      - name: Read Telegram channel
        run: python -u fetch_stockpro.py
      - name: Save to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add positional_trades.json symbol_map.json
          if ! git diff --cached --quiet; then
            git commit -m "Update positional trades"
            git pull --rebase origin main
            git push
          else
            echo "No changes"
          fi
