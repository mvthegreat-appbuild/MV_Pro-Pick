name: Update NSE CMP
on:
schedule:
- cron: '*/15 3-10 * * 1-5'
workflow_dispatch:
push:
paths:
- 'positional_trades.json'
permissions:
contents: write
jobs:
update-cmp:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: '3.11'
- name: Fetch Live NSE Prices
run: python -c "import json, re, urllib.request; ALIASES={'TATA TECH':'TATATECH','TATA TECHNOLOGIES':'TATATECH','TATA MOTORS':'TATAMOTORS','TATA POWER':'TATAPOWER','TATA STEEL':'TATASTEEL','HDFC BANK':'HDFCBANK','ICICI BANK':'ICICIBANK','STATE BANK':'SBIN','INFOSYS':'INFY','BHARTI AIRTEL':'BHARTIARTL','BAJAJ FINANCE':'BAJFINANCE','LARSEN':'LT'}; trades=json.load(open('positional_trades.json',encoding='utf-8')).get('trades',[]); prices={}; get_sym=lambda t: re.sub(r'.(NS|BO)$','',str(t.get('symbol') or '').strip().upper()) or next((v for k,v in ALIASES.items() if k in str(t.get('name') or '').upper()), re.sub(r'[^A-Z0-9&-]', '', re.split(r'[\s(]', str(t.get('name') or '').strip().upper())[0])); [prices.**setitem**(s, round(float(json.loads(urllib.request.urlopen(urllib.request.Request(f'https://query1.finance.yahoo.com/v8/finance/chart/{s}.NS?interval=1d&range=1d',headers={'User-Agent':'Mozilla/5.0'})),timeout=10).read())['chart']['result'][0]['meta']['regularMarketPrice']), 2)) for t in trades for s in [get_sym(t)] if s and s not in prices and not print('Fetching', s)]; open('cmp.json','w',encoding='utf-8').write(json.dumps({'prices':prices},indent=2))"
- name: Commit cmp.json
run: |
git config user.name "github-actions[bot]"
git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
git add cmp.json
git diff --staged --quiet || git commit -m "Auto-update NSE CMP"
git push
